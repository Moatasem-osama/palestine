<body>

<div class="spinner-container">
  <div class="spinner-border text-danger" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container my-5">
  <h2>غزة</h2>
  <div class="row gy-4" id="gaza"></div>
</div>

<div class="container my-5">
  <h2>الضفة الغربية</h2>
  <div class="row gy-4" id="westBank"></div>
</div>

<div class="container my-5">
    <h2>الشهداء المعروفين في غزة</h2>
    <div class="row gy-4" id="knownKilled"></div>
</div>
<div class="container my-5">
  <h2>الصحفيين الشهداء في غزة</h2>
  <div class="row gy-4" id="press"></div>
</div>

<script>
const spinner = document.querySelector('.spinner-container');

async function fetchData() {
  spinner.classList.remove('d-none');
  const res = await fetch('https://data.techforpalestine.org/api/v3/summary.min.json');
  const data = await res.json();
  spinner.classList.add('d-none');

  displayGaza(data.gaza);
  displayWestBank(data.west_bank);
  displayPress(data.known_press_killed_in_gaza);
  displayKnownKilled(data.known_killed_in_gaza);
}

function displayGaza(data) {
  const container = document.getElementById('gaza');
  container.innerHTML = `
    <div class="col-lg-4 col-md-6">
      <div class="card">
        <h5>آخر تحديث: ${data.last_update}</h5>
        <p>عدد التقارير: ${data.reports}</p>
        <p>عدد المجازر: ${data.massacres}</p>
        <p>الشهداء الكلي: ${data.killed.total}</p>
        <p>الشهداء الأطفال: ${data.killed.children}</p>
        <p>الشهداء النساء: ${data.killed.women}</p>
        <p>الشهداء الصحفيين: ${data.killed.press}</p>
        <p>الشهداء الطبيين: ${data.killed.medical}</p>
        <p>المصابين الكلي: ${data.injured.total}</p>
      </div>
    </div>
  `;
}

function displayWestBank(data) {
  const container = document.getElementById('westBank');
  container.innerHTML = `
    <div class="col-lg-4 col-md-6">
      <div class="card">
        <h5>آخر تحديث: ${data.last_update}</h5>
        <p>عدد التقارير: ${data.reports}</p>
        <p>عدد الهجمات الاستيطانية: ${data.settler_attacks}</p>
        <p>الشهداء الكلي: ${data.killed.total}</p>
        <p>الشهداء الأطفال: ${data.killed.children}</p>
        <p>المصابين الكلي: ${data.injured.total}</p>
        <p>المصابين الأطفال: ${data.injured.children}</p>
      </div>
    </div>
  `;
}

function displayPress(data) {
  const container = document.getElementById('press');
  container.innerHTML = `
    <div class="col-lg-4 col-md-6">
      <div class="card">
        <p>عدد الصحفيين الشهداء: ${data.records}</p>
      </div>
    </div>
  `;
}

function displayKnownKilled(data) {
  const container = document.getElementById('knownKilled');
  container.innerHTML = `
    <div class="col-lg-4 col-md-6">
      <div class="card">
        <p>عدد السجلات: ${data.records}</p>
        <p>عدد الصفحات: ${data.pages}</p>
        <p>حجم الصفحة: ${data.page_size}</p>
        <p>الذكور:</p>
        <ul>
          <li>بالغ: ${data.male.adult}</li>
          <li>كبير السن: ${data.male.senior}</li>
          <li>طفل: ${data.male.child}</li>
        </ul>
        <p>الإناث:</p>
        <ul>
          <li>بالغ: ${data.female.adult}</li>
          <li>كبير السن: ${data.female.senior}</li>
          <li>طفل: ${data.female.child}</li>
        </ul>
      </div>
    </div>
  `;
}

fetchData();
</script>
</body>
