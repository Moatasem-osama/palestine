<div class="container my-4">
  <h2>اختر التاريخ لعرض البيانات:</h2>
  <select id="dateSelect" class="form-select mb-3">
    <option value="">اختر تاريخ</option>
  </select>

  <div id="dataDisplay"></div>
</div>

<script>
let allData = [];
const select = document.getElementById('dateSelect');

async function fetchData() {
  let response = await fetch('https://data.techforpalestine.org/api/v2/casualties_daily.min.json');
  let result = await response.json();
  allData = result;
  populateSelect(result);
}

function populateSelect(result) {
  result.forEach(entry => {
    const option = document.createElement('option');
    option.value = entry.report_date;
    option.textContent = entry.report_date;
    select.appendChild(option);
  });
}

select.addEventListener('change', function () {
  const selectedData = this.value;
  const entry = allData.find(item => item.report_date === selectedData);
  displayData(entry);
});

function displayData(entry) {
  const div = document.getElementById('dataDisplay');
  if (!entry) {
    div.innerHTML = '';
    return;
  }

  div.innerHTML = `
    <div class="card">
      <h4>تاريخ: ${entry.report_date}</h4>
      <p>المصدر: ${entry.report_source ?? 'غير متوفر'}</p>
      <p>مدة التقرير (ساعة): ${entry.report_period ?? 'غير معروف'}</p>
      <p class="highlight-killed">الشهداء اليوم: ${entry.killed ?? 'غير معروف'}</p>
      <p class="highlight-injured">المصابين اليوم: ${entry.ext_injured ?? 'غير معروف'}</p>
      <p class="highlight-children">الشهداء الأطفال اليوم: ${entry.killed_children_cum ?? 'غير معروف'}</p>
      <p class="highlight-women">الشهداء النساء اليوم: ${entry.killed_women_cum ?? 'غير معروف'}</p>
      <p class="highlight-medical">الفرق الطبية التي استشهدت اليوم: ${entry.ext_med_killed_cum ?? 'غير معروف'}</p>
      <p class="highlight-press">الصحفيين الذين استشهدوا اليوم: ${entry.ext_press_killed_cum ?? 'غير معروف'}</p>
      <p>عدد المجازر الخارجية التراكمية: ${entry.ext_massacres_cum ?? 'غير معروف'}</p>
      <p>القتلى التراكمي: ${entry.killed_cum ?? 'غير معروف'}</p>
      <p>المصابين التراكمي: ${entry.injured_cum ?? 'غير معروف'}</p>
      <p>القتلى الأطفال التراكمي: ${entry.ext_killed_children_cum ?? 'غير معروف'}</p>
      <p>القتلى النساء التراكمي: ${entry.ext_killed_women_cum ?? 'غير معروف'}</p>
      <p>الفرق الطبية التراكمي: ${entry.ext_med_killed_cum ?? 'غير معروف'}</p>
      <p>الصحفيين التراكمي: ${entry.ext_press_killed_cum ?? 'غير معروف'}</p>
    </div>
  `;
}

fetchData();
</script>
