  <div class="container my-4">
    <h2>اختر التاريخ لعرض البيانات:</h2>
    <select id="dateSelect" class="form-select mb-3">
      <option value="">اختر تاريخ</option>
    </select>

    <div id="dataDisplay"></div>
  </div>

<script>
let allData =[];
const select = document.getElementById('dateSelect');

async function fetchData() {
  let response = await fetch('https://data.techforpalestine.org/api/v2/west_bank_daily.min.json');
  let result = await response.json();
  allData = result;
  popularSelect(result);
}

function popularSelect(result) {
  result.forEach(entry => {
    const option = document.createElement('option');
    option.value = entry.report_date;
    option.textContent = entry.report_date;
    select.appendChild(option);
  });
}

select.addEventListener('change', function () {
  const selectedData = this.value;
  const entry = allData.find(item => item.report_date === selectedData);
  displayData(entry);
});

function displayData(entry) {
  const div = document.getElementById('dataDisplay');
  if (!entry) {
    div.innerHTML=``;
    return;
  }

  const verified = entry.verified || {};

  div.innerHTML = `
  <div class="card p-3 shadow-sm mb-3">
    <h4>تاريخ: ${entry.report_date}</h4>
    <p class="highlight-killed">الشهداء اليوم: ${verified.killed ?? 'غير معروف'}</p>
    <p class="highlight-injured">المصابين اليوم: ${verified.injured ?? 'غير معروف'}</p>
    <p class="highlight-children">الشهداء الأطفال اليوم: ${verified.killed_children ?? 'غير معروف'}</p>
    <p class="highlight-children">المصابين الأطفال اليوم: ${verified.injured_children ?? 'غير معروف'}</p>
    <p>الشهداء التراكمي: ${verified.killed_cum ?? entry.killed_cum ?? 'غير معروف'}</p>
    <p>المصابين التراكمي: ${verified.injured_cum ?? entry.injured_cum ?? 'غير معروف'}</p>
    <p>الشهداء الأطفال التراكمي: ${verified.killed_children_cum ?? entry.killed_children_cum ?? 'غير معروف'}</p>
    <p>المصابين الأطفال التراكمي: ${verified.injured_children_cum ?? entry.injured_children_cum ?? 'غير معروف'}</p>
  </div>`;
}

fetchData();
</script>
